<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon ECAM</title>
<meta name="theme-color" content="#2E2783">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div>
    <h1 id="today">Mon ECAM</h1>
    <p id="maj" class="muted"></p>
    <p id="err" class="err" hidden></p>
    <p class="muted small"><a id="force" target="_blank" rel="noopener" hidden>Forcer une synchro sur GitHub</a></p>
  </div>
  <button id="sync" class="sync" type="button">Actualiser</button>
</header>

<main id="app">
  <section id="v-planning" class="view active" aria-labelledby="t-planning">
    <h2 id="t-planning" class="sr">Planning</h2>
    <div id="door"></div>
    <nav id="days" class="days" aria-label="Jours"></nav>
    <ol id="slots" class="slots"></ol>
  </section>

  <aside class="side">
    <section id="v-devoirs" class="view" aria-labelledby="t-devoirs">
      <h2 id="t-devoirs">À rendre</h2>
      <ul id="devoirs" class="list"></ul>
    </section>

    <section id="v-notes" class="view" aria-labelledby="t-notes">
      <h2 id="t-notes">Dernières notes</h2>
      <ul id="notes" class="list"></ul>
    </section>

    <section id="v-cours" class="view" aria-labelledby="t-cours">
      <h2 id="t-cours">Cours Moodle</h2>
      <input id="filtre" class="filtre" type="search" placeholder="Chercher un cours" aria-label="Chercher un cours">
      <ul id="cours" class="list compact"></ul>
    </section>
  </aside>
</main>

<nav class="tabs" aria-label="Sections">
  <button data-v="planning" class="on">Planning</button>
  <button data-v="devoirs">Devoirs<span id="badge" class="badge" hidden></span></button>
  <button data-v="notes">Notes</button>
  <button data-v="cours">Cours</button>
</nav>

<div id="lock" class="lock" hidden>
  <form>
    <h2>Mon ECAM</h2>
    <p class="muted">Tes données sont chiffrées. Entre le mot de passe de l'appli, celui que tu as mis dans APP_PASSWORD sur GitHub. Il reste enregistré sur cet appareil.</p>
    <label for="pw">Mot de passe de l'appli</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p id="lock-msg" class="err"></p>
    <button type="submit">Déverrouiller</button>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
