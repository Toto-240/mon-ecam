name: Fiches de cours

# L'appli dépose les enregistrements (chiffrés) sur la branche « inbox ».
# Ce workflow les transforme en fiches avec Gemini, les range (chiffrées) dans main,
# vide la boîte puis relance la synchro pour que l'appli les affiche.
on:
  push:
    branches: [inbox]
  schedule:
    - cron: "37 * * * *"   # nouvel essai chaque heure s'il reste quelque chose
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fiches
  cancel-in-progress: false

jobs:
  fiches:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : le « pull --rebase » marche même si l'appli a écrit entre-temps
          path: main

      - name: Ouvrir la boîte de dépôt
        id: inbox
        run: |
          if git -C main ls-remote --exit-code --heads origin inbox >/dev/null 2>&1; then
            git -C main fetch --depth 1 origin inbox
            git -C main worktree add ../inbox FETCH_HEAD
            echo "sha=$(git -C inbox rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "Boîte vide"
          fi

      - if: steps.inbox.outputs.has
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.inbox.outputs.has
        name: Installer les outils
        # ffmpeg et LibreOffice ne sont installés que si un enregistrement ou un devoir en a besoin
        # (process_inbox.py) : une révision n'attend pas leur installation
        run: pip install -q -r main/requirements.txt google-genai python-docx python-pptx

      - if: steps.inbox.outputs.has
        name: Créer les fiches
        working-directory: main
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ECAM_USER: ${{ secrets.ECAM_USER }}
          ECAM_PASSWORD: ${{ secrets.ECAM_PASSWORD }}
        run: python process_inbox.py ../inbox .

      - if: steps.inbox.outputs.has
        name: Ranger les fiches
        working-directory: main
        run: |
          git config user.name "Mon ECAM"
          git config user.email "mon-ecam@users.noreply.github.com"
          bash save_main.sh "Fiches mises à jour" fiches revisions erreurs devoirs depots cartes ds_detectes

      - if: steps.inbox.outputs.has
        name: Vider la boîte
        working-directory: inbox
        run: |
          total=$(ls inbox/*.bin inbox/*.part 2>/dev/null | wc -l)
          traites=$(grep -c . .traites || true)
          [ "$traites" -gt 0 ] || exit 0
          # tout a été traité et rien n'est arrivé entre-temps : on supprime la boîte
          if [ "$traites" -ge "$total" ] && git -C ../main push -q --force-with-lease=inbox:${{ steps.inbox.outputs.sha }} origin :inbox; then
            echo "Boîte vidée"; exit 0
          fi
          # sinon : on retire seulement les éléments traités de la dernière version de la boîte
          # (sans ça, ils étaient refaits à chaque passage)
          git config user.name "Mon ECAM"; git config user.email "mon-ecam@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin inbox || exit 0
            git reset -q --hard FETCH_HEAD
            while read -r f; do [ -n "$f" ] && git rm -q --ignore-unmatch "inbox/$f"; done < .traites
            git diff --cached --quiet && exit 0
            git commit -q -m "Éléments traités retirés" && git push -q origin HEAD:inbox && { echo "Éléments traités retirés"; exit 0; }
            sleep 3
          done
          echo "::warning::Boîte non vidée, les éléments seront retirés au prochain passage"

      - if: steps.inbox.outputs.has
        name: Publier dans l'appli
        env:
          GH_TOKEN: ${{ github.token }}
        # publication rapide : sans refaire le tour de Moodle et de l'intranet
        run: |
          for i in 1 2 3; do gh workflow run sync.yml -R "${{ github.repository }}" -f rapide=true && exit 0; sleep 10; done
          echo "::warning::Publication non lancée, la synchro suivante (20 min max) affichera les nouveautés"
