name: Synchro ECAM

on:
  schedule:
    # Heures en UTC (Paris = UTC+1 l'hiver, UTC+2 l'été)
    - cron: "*/10 5-19 * * *"       # toutes les 10 min, environ 6h-21h à Paris
    - cron: "7 20-23,0-4 * * *"     # une fois par heure la nuit
  workflow_dispatch:          # bouton "Run workflow" pour forcer une synchro
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # pour l'anti-pause des 60 jours

concurrency:
  group: pages
  cancel-in-progress: true   # si une synchro traîne, la suivante la remplace

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Récupérer Moodle + intranet
        env:
          ECAM_USER: ${{ secrets.ECAM_USER }}
          ECAM_PASSWORD: ${{ secrets.ECAM_PASSWORD }}
        run: python ecam_scraper.py

      - name: Chiffrer les données et préparer le site
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Anti-pause (une fois par jour)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub met en pause les synchros auto après 60 jours sans activité :
          # réactiver le workflow chaque jour remet ce compteur à zéro.
          if [ "$(date -u +%H)" = "05" ] && [ "$(date -u +%M)" -lt 10 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable" && echo "Anti-pause ok"
          fi
