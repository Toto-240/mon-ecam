name: Appli iPhone (IPA)

# Fabrique MonECAM.ipa (non signée) sur un Mac de GitHub.
# Tu l'installes ensuite depuis ton PC avec Sideloadly, qui la signe avec ton compte Apple.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios-app/**", ".github/workflows/build-ios.yml"]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15-intel   # les Mac arm64 de GitHub sont souvent saturés
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Créer le projet iOS
        working-directory: ios-app
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Autoriser le micro (enregistrement des cours)
        working-directory: ios-app
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Mon ECAM enregistre tes cours pour en faire des fiches.'" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Mon ECAM enregistre tes cours pour en faire des fiches.'" "$PLIST"
          for kv in "NSCameraUsageDescription|Mon ECAM prend en photo le tableau et tes documents pour en faire des fiches." \
                    "NSPhotoLibraryUsageDescription|Mon ECAM ajoute tes photos de cours aux fiches." \
                    "NSPhotoLibraryAddUsageDescription|Mon ECAM enregistre tes fichiers dans Photos quand tu le demandes."; do
            k="${kv%%|*}"; v="${kv#*|}"
            /usr/libexec/PlistBuddy -c "Add :$k string '$v'" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :$k '$v'" "$PLIST"
          done
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true

      - name: Ajouter l'enregistreur natif (écran éteint)
        working-directory: ios-app
        run: |
          cp native/DictaPlugin.swift native/MainViewController.swift ios/App/App/
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby native/add_files.rb
          SB=ios/App/App/Base.lproj/Main.storyboard
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="MainViewController" customModule="App" customModuleProvider="target"/' "$SB"
          grep -q 'customClass="MainViewController"' "$SB" || { echo "::error::Main.storyboard non modifié"; exit 1; }

      - name: Mettre l'icône
        working-directory: ios-app
        run: |
          SET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$SET"/*.png; do cp icon-1024.png "$f"; done

      - name: Compiler (sans signature)
        working-directory: ios-app/ios/App
        run: |
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          set -o pipefail
          if ! xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > build.log 2>&1; then
            # erreurs affichées en résumé (lisibles sans ouvrir les journaux)
            grep -E "error:" build.log | sort -u | head -15 | while read -r l; do echo "::error::${l##*/}"; done
            tail -n 40 build.log
            exit 1
          fi
          tail -n 5 build.log

      - name: Emballer en .ipa
        working-directory: ios-app/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/MonECAM.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/MonECAM.ipa"

      - name: Publier dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ipa -y --cleanup-tag || true
          gh release create ipa MonECAM.ipa --title "Appli iPhone" \
            --notes "Télécharge MonECAM.ipa puis installe-la avec Sideloadly depuis ton PC."
