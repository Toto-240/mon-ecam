name: Notification test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/notif-test.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Envoyer une notification de test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import notif
          notif.send("Mon ECAM", "Notification de test - tout fonctionne", tags=["white_check_mark"])
          print("envoyée")
          PY
