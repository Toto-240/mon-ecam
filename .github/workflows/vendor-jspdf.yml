name: vendor-jspdf
on: workflow_dispatch
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p web/lib
          curl -fsSL https://registry.npmjs.org/jspdf/-/jspdf-2.5.2.tgz -o /tmp/j.tgz
          tar -xzf /tmp/j.tgz -C /tmp
          cp /tmp/package/dist/jspdf.umd.min.js web/lib/jspdf.umd.min.js
          ls -la web/lib
          git config user.name "Mon ECAM"; git config user.email "mon-ecam@users.noreply.github.com"
          bash save_main.sh "Bibliothèque jsPDF" web/lib/jspdf.umd.min.js
